services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure -d procure"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
