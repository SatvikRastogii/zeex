[project]
name = "z-procure-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["alembic"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "E501"]  # formatter owns line width; long strings/regexes stay whole

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"app/seed/**" = ["S311"]
"app/channels/templates.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[[tool.mypy.overrides]]
# No bundled types; stub packages would be an extra dependency.
module = ["openpyxl", "openpyxl.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Draws the demo PDFs with reportlab, which ships no types.
module = ["app.seed.sample_docs"]
disallow_untyped_calls = false
